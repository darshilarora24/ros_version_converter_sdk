[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-migrate"
version = "0.1.0"
description = "ROS1 to ROS2 migration SDK (scaffold)"
requires-python = ">=3.9"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
dependencies = []

[project.scripts]
ros-migrate = "cli.ros_migrate:main"

[tool.setuptools]
packages = ["sdk", "cli"]
